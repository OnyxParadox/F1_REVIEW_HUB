services:
  # =========================================================
  # 1. DATABASE TIER: PostgreSQL Database Container
  # =========================================================
  database:
    image: postgres:15-alpine
    container_name: f1_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      # Persistent PostgreSQL volume
      - postgres-data:/var/lib/postgresql/data
      # Auto-seed SQL scripts on first database initialization
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - f1-network

  # =========================================================
  # 2. BACKEND TIER: Node.js / Express REST API Container
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: f1_backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - f1-network

  # =========================================================
  # 3. FRONTEND TIER: React SPA + Nginx Web Server Container
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: f1_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - f1-network

# Isolated Bridge Network
networks:
  f1-network:
    name: f1-app-network
    driver: bridge

# Named Volume for Persistent PostgreSQL Storage
volumes:
  postgres-data:
    name: f1_postgres_data
